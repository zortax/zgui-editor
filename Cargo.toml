[package]
name = "zgui-editor"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "An embeddable, high-performance code editor component for Zgui applications"
repository = "https://github.com/zortax/zgui-editor"
keywords = ["editor", "code", "zgui", "tree-sitter"]
categories = ["gui", "text-editors"]
authors = ["Leonard Seibold <git@zrtx.de>"]

[dependencies]
zgui = { git = "https://github.com/zortax/zgui" }
# `LineRequest::families` is `&[Ident]`, and the umbrella crate does not re-export the type.
zgui-interned = { git = "https://github.com/zortax/zgui" }
# Reading the colours a style sheet set, which the umbrella crate does not re-export either.
zgui-css = { git = "https://github.com/zortax/zgui" }
# Lowering the computed style's font properties to the shaper's vocabulary.
zgui-text-style = { git = "https://github.com/zortax/zgui" }
ropey = "1.6"
tree-sitter = "0.26"
streaming-iterator = "0.1"
unicode-segmentation = "1"
unicode-width = "0.2"
rustc-hash = "2"
smallvec = "1"
compact_str = "0.10"
flume = { version = "0.12", default-features = false, features = ["async"] }
serde = { version = "1", features = ["derive"], optional = true }

tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-toml-ng = { version = "0.7", optional = true }
tree-sitter-md = { version = "0.5", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-yaml = { version = "0.7.2", optional = true }
tree-sitter-json = { version = "0.24.8", optional = true }

[features]
default = []
# Writing a document's text and its undo history down, which is what a session needs.
serde = ["dep:serde", "smallvec/serde"]
# Bundled grammars, one feature per language so an application ships only what it uses.
lang-rust = ["dep:tree-sitter-rust"]
lang-toml = ["dep:tree-sitter-toml-ng"]
lang-markdown = ["dep:tree-sitter-md"]
lang-python = ["dep:tree-sitter-python"]
lang-yaml = ["dep:tree-sitter-yaml"]
lang-json = ["dep:tree-sitter-json"]
all-languages = [
    "lang-rust",
    "lang-toml",
    "lang-markdown",
    "lang-python",
    "lang-yaml",
    "lang-json",
]
tree-sitter-yaml = ["dep:tree-sitter-yaml"]
tree-sitter-json = ["dep:tree-sitter-json"]

[dev-dependencies]
zgui-testkit-view = { git = "https://github.com/zortax/zgui" }
zgui-testkit-scene = { git = "https://github.com/zortax/zgui" }
zgui-platform-headless = { git = "https://github.com/zortax/zgui" }
zgui-layout = { git = "https://github.com/zortax/zgui" }
serde_json = "1"

[[example]]
name = "basic"
required-features = ["lang-rust"]

[[example]]
name = "vim"
path = "examples/vim/main.rs"
required-features = ["lang-rust"]

[[example]]
name = "completion"
required-features = ["lang-rust"]
